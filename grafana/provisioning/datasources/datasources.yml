apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus 
    access: proxy 
    uid: prometheus-sre
    url: http://prometheus:9090
    isDefault: true
    editable: false
  
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:              # <-- We added this block to link them!
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: 'prometheus-sre'
